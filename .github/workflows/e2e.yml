name: E2E Tests
on:
  pull_request:
    branches:
      - main
      - next

jobs:
  e2e:
    timeout-minutes: 15
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run E2E tests
        env:
          REDUCTO_API_KEY: ${{ secrets.REDUCTO_API_KEY }}
        run: uv run pytest tests/e2e/ -v -x -o "addopts=" -n auto --dist loadscope
