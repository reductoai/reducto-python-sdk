name: spec-snapshot
# Refreshes spec/openapi.json from https://reducto.ai/openapi.json on a schedule.
# When the live spec changed, it pushes the new snapshot to a fixed branch and
# opens (or updates) a PR. The spec-drift check on that PR shows what the SDK
# must change to match.
#
# Needs "Allow GitHub Actions to create and approve pull requests" enabled in
# Settings > Actions > General.

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: chore/spec-snapshot

jobs:
  refresh:
    name: refresh spec snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Update snapshot and check drift
        id: update
        run: |
          set -o pipefail
          uv run python scripts/spec_drift.py --update-snapshot --warn-only | tee drift.txt
          if git diff --quiet -- spec/openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(uv run python -c 'import json; print(json.load(open("spec/openapi.json"))["info"]["version"])')" >> "$GITHUB_OUTPUT"
          fi

      - name: Write job summary
        run: |
          {
            echo "## Spec snapshot"
            echo
            if [ "${{ steps.update.outputs.changed }}" = "true" ]; then
              echo "Snapshot updated to `${{ steps.update.outputs.version }}`."
            else
              echo "Snapshot is current."
            fi
            echo
            echo '```'
            cat drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push snapshot branch
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add spec/openapi.json
          git commit -m "chore: update spec snapshot to ${{ steps.update.outputs.version }}"
          git push --force origin "$BRANCH"

      - name: Open or update PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automated refresh of `spec/openapi.json` from https://reducto.ai/openapi.json."
            echo
            echo "Spec version: `${{ steps.update.outputs.version }}`"
            echo
            echo "The `spec-drift` check on this PR lists what the SDK must change to match. Sync the SDK on this branch, then merge."
            echo
            echo '<details><summary>Drift report at snapshot time</summary>'
            echo
            echo '```'
            cat drift.txt
            echo '```'
            echo '</details>'
          } > pr_body.md
          title="chore: update spec snapshot to ${{ steps.update.outputs.version }}"
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file pr_body.md
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" --title "$title" --body-file pr_body.md
          fi
